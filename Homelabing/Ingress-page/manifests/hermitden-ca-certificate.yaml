apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: hermitden-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: hermitden-ca
  secretName: hermitden-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io