apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermitden-site
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermitden-site
  template:
    metadata:
      labels:
        app: hermitden-site
    spec:
      imagePullSecrets:
        - name: gitea-registry-secret
      containers:
        - name: hermitden-site
          image: gitea.hermitden/virtualhermit/hermitden-site:8426bb6
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: deploy-history
              mountPath: /usr/share/nginx/html/deploy-history.json
              subPath: data.json
      volumes:
        - name: deploy-history
          configMap:
            name: deploy-history