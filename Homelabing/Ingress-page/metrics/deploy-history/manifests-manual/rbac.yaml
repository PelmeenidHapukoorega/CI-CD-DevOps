apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-history-reader
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-history-app-reader
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
    resourceNames: ["hermitden-site"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-history-app-reader-binding
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: deploy-history-reader
    namespace: argocd
roleRef:
  kind: Role
  name: deploy-history-app-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-history-configmap-writer
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]
    resourceNames: ["deploy-history"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-history-configmap-writer-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: deploy-history-reader
    namespace: argocd
roleRef:
  kind: Role
  name: deploy-history-configmap-writer
  apiGroup: rbac.authorization.k8s.io